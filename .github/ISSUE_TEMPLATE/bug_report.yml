name: Bug 反馈
description: 某个功能不生效 / 行为与预期不符
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！这个模组的行为强依赖你的机器结构，麻烦按下面几项填写，
        绝大多数问题靠 `/gregnuovo status` 与调试日志就能直接定位。

  - type: input
    id: versions
    attributes:
      label: 版本
      description: 游戏 / Forge / GTM / AE2 / GregNuovo 的版本（logs/latest.log 开头通常就有）
      placeholder: "例：1.20.1 / Forge 47.4.10 / GTM 7.3.0 / AE2 15.4.10 / GregNuovo 1.0.3"
    validations:
      required: true

  - type: dropdown
    id: topology
    attributes:
      label: 推料结构
      description: 样板供应器紧挨着的是什么方块？
      options:
        - 单方块 GT 机器
        - 多方块 + 输入总线
        - 多方块 + ME输入总线
        - 多方块 + ME样板总成
        - 其它（请在下面说明）
    validations:
      required: true

  - type: textarea
    id: status
    attributes:
      label: /gregnuovo status 输出
      description: 进游戏（需要 OP）执行 `/gregnuovo status`，把完整输出贴在这里
      render: text
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: 调试日志
      description: |
        把 `config/gregnuovo-common.toml` 里的 `misc.debugLog` 改成 `true`，重启游戏，复现一次，
        然后贴出 `logs/latest.log` 里**所有含 `GregNuovo` 的行**（也可以把整份日志作为附件上传）。
      render: text
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 现象与预期
      description: 具体是哪一项功能不生效？你期望发生什么、实际发生了什么？样板里都放了什么？
    validations:
      required: true
