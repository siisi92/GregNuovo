// GregNuovo —— AE2 与 GTM(1.21.1) 自动合成整合附属
//
// 构建插件用 NeoForge 官方推荐的 ModDevGradle。
// 版本写在 gradle.properties 的 moddevgradle_version 里（这里必须是字面量，Gradle 的 plugins 块不支持属性插值）。
// 如果 ModDevGradle 拉不下来，可改用 NeoGradle（GTM 本体用的就是它）：
//   1) 把下面这行换成：id 'net.neoforged.gradle.userdev' version '7.0.171'
//   2) 把 dependencies 里的 `localJars` 换成 implementation/compileOnly，
//      并在文件末尾用 `runs { configureEach { modSource sourceSets.main } }` 声明开发运行。
plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.neoforged.moddev' version '2.0.147'
}

group = project.mod_group
version = project.mod_version
base { archivesName = project.mod_id }

java {
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
    flatDir { dirs project.libs_dir }
}

// ---------------------------------------------------------------------------
// 本地依赖 jar：GTM / AE2 / LDLib / Architectury / GuideME
//
// 这些 jar 只用于编译与开发运行，不随本仓库分发、也不会打包进产物。
// 从任意一个装好这些 mod 的整合包实例的 mods/ 目录里复制到 libs/ 即可，
// 文件名不必与下面一致（这里按关键字匹配，兼容不同版本号写法）。
// ---------------------------------------------------------------------------
def libsDir = file(project.libs_dir)
def localJars = libsDir.exists()
        ? fileTree(libsDir) { include '*.jar' }
        : files()

def requiredLibHints = [
        'gtceu'                : 'GregTech Modern 1.21.1（gtceu-1.21.1-7.0.x.jar）',
        'appliedenergistics2'  : 'Applied Energistics 2 1.21.1（appliedenergistics2-19.2.x.jar）',
        'ldlib'                : 'LDLib2（ldlib2-neoforge-1.21.1-*.jar）',
        'architectury'         : 'Architectury API（architectury-*-neoforge.jar）'
]

def missingHints = []
if (!libsDir.exists()) {
    missingHints = requiredLibHints.values() as List
} else {
    def names = localJars.files.collect { it.name.toLowerCase(Locale.ROOT) }
    requiredLibHints.each { keyword, hint ->
        if (!names.any { it.contains(keyword) }) {
            missingHints.add(hint)
        }
    }
}

if (!missingHints.isEmpty()) {
    def message = "libs/ 目录里缺少编译所需的依赖 jar：\n  - " + missingHints.join("\n  - ") +
            "\n请把它们放进 ${project.libs_dir}/ 目录（文件名不限，含关键字即可）。\n" +
            "最省事的做法：从已装好这些 mod 的整合包实例的 mods/ 目录里复制过来。"
    def tasks = gradle.startParameter.taskNames.join(' ')
    def needsLibs = tasks.isEmpty() || ['build', 'jar', 'run', 'compile', 'test'].any { tasks.contains(it) }
    if (needsLibs) {
        throw new GradleException(message)
    }
    logger.lifecycle("[GregNuovo] 提示：" + message)
}

dependencies {
    // 编译期：只要接口/类签名
    compileOnly localJars

    // 运行期（./gradlew runClient / runServer）：GTM、AE2 等作为 mod 加载
    runtimeOnly localJars
    // 1.21.1 的 ModDevGradle 需要显式把本地 jar 加进开发运行的 classpath
    additionalRuntimeClasspath localJars
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
        }
        server {
            server()
            systemProperty 'forge.logging.console.level', 'debug'
            jvmArgument '-Xmx2G'
        }
    }

    mods {
        gregnuovo {
            sourceSet sourceSets.main
        }
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(
                'version': project.version,
                'mod_id': project.mod_id,
                'mod_name': project.mod_name,
                'mod_license': project.mod_license,
                'mod_authors': project.mod_authors,
                'mod_description': project.mod_description
        )
    }
}

jar {
    // LGPL-3.0：把许可证随产物一起分发
    def licenseFile = file('../LICENSE')
    if (licenseFile.exists()) {
        from(licenseFile) {
            rename { "LICENSE-${project.mod_id}" }
            into 'META-INF'
        }
    }
    manifest {
        attributes([
                'Specification-Title'   : project.mod_id,
                'Specification-Version' : '1',
                'Implementation-Title'  : project.mod_name,
                'Implementation-Version': project.version,
                'Implementation-Vendor' : project.mod_authors
        ] as LinkedHashMap)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // 1.21.1 需要 Java 21：请用 JDK 21 运行 Gradle（例如设置 JAVA_HOME 或 org.gradle.java.home）
    options.release = project.java_version as int
}
