# ============ GregNuovo 构建属性（MC 1.21.1 / NeoForge）============
# 目标：MC 1.21.1 / NeoForge 21.1.x / GTM 1.21.1-7.0.x / AE2 19.2.x

minecraft_version=1.21.1
# NeoForge 版本，可在 https://projects.neoforged.net/neoforged/neoforge 查最新 21.1.x
neo_version=21.1.248
# 构建插件版本（见 build.gradle 顶部说明）
moddevgradle_version=2.0.147

mod_id=gregnuovo
mod_name=GregNuovo
mod_license=LGPL-3.0
mod_version=1.2.0
mod_group=com.gregnuovo
mod_authors=GregNuovo contributors
mod_description=AE2 x GregTech Modern autocrafting integration: per-pattern programmed circuits, non-consumable returns, chanced-output retry and byproduct awareness. Unofficial addon, not affiliated with the AE2 or GregTechCEu teams.

# 本地依赖 jar 目录（GTM / AE2 / LDLib / Architectury / GuideME），见 libs/README.md
libs_dir=libs

# 1.21.1 需要 Java 21（NeoForge 21.1.x 要求）
java_version=21

org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
