// GregNuovo —— AE2 与 GTM(1.20.1) 自动合成整合附属
plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.0.26)'
}

group = project.mod_group
version = project.mod_version
base { archivesName = project.mod_id }

java {
    withSourcesJar()
}

repositories {
    mavenCentral()
}

// ---------------------------------------------------------------------------
// 编译所需的依赖 jar：GTM / AE2 / LDLib / Architectury / Configuration / GuideME
//
// 这些 jar 只用于编译与开发运行，不随本仓库分发，也不会打包进产物。
// 这里按关键字匹配文件名，所以从整合包 mods/ 目录里直接复制过来的名字
// （可能带前缀、小版本号不同）也能用。详见 libs/README.md。
// ---------------------------------------------------------------------------
def libsDir = file(project.libs_dir)
def localJars = libsDir.exists()
        ? fileTree(libsDir) { include '*.jar' }
        : files()

def requiredLibHints = [
        'gtceu'              : 'GregTech CEu Modern 1.20.1-7.3.0（gtceu-1.20.1-7.3.0.jar）',
        'appliedenergistics2': 'Applied Energistics 2 15.4.10 Forge（appliedenergistics2-forge-15.4.10.jar）',
        'ldlib'              : 'LDLib（ldlib-forge-1.20.1-*.jar）',
        'architectury'       : 'Architectury API（architectury-*-forge.jar）'
]

def libNames = localJars.files.collect { it.name.toLowerCase(Locale.ROOT) }
def missingHints = requiredLibHints.findAll { keyword, hint -> !libNames.any { it.contains(keyword) } }
        .values() as List

if (!missingHints.isEmpty()) {
    def message = "libs/ 目录里缺少编译所需的依赖 jar：\n  - " + missingHints.join("\n  - ") +
            "\n请把它们放进 ${project.libs_dir}/ 目录（文件名不限，含关键字即可），详见 libs/README.md。\n" +
            "最省事的做法：从已装好这些 mod 的 1.20.1 整合包实例的 mods/ 目录里复制过来。"
    def tasks = gradle.startParameter.taskNames.join(' ')
    def needsLibs = tasks.isEmpty() || ['build', 'jar', 'run', 'compile', 'test'].any { tasks.contains(it) }
    if (needsLibs) {
        throw new GradleException(message)
    }
    logger.lifecycle("[GregNuovo] 提示：" + message)
}

// 防呆：混进 1.21.1 / NeoForge 的 jar 时直接说清楚（两个版本的混淆名不通用）
def wrongVersionJars = localJars.files.findAll {
    it.name.contains('1.21.1') || it.name.toLowerCase(Locale.ROOT).contains('neoforge')
}.collect { it.name }.sort()
if (!wrongVersionJars.isEmpty()) {
    throw new GradleException("libs/ 里混着 1.21.1 / NeoForge 的依赖 jar，1.20.1 版用不了：\n  - " +
            wrongVersionJars.join("\n  - ") +
            "\n1.20.1 请用 Forge 的构建；如果你想玩 1.21.1 版，见 1.21.1-neoforge 分支。")
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"

    // 上游 mod：本体在目标整合包里，这里只用于编译与开发运行
    compileOnly fg.deobf(localJars)
    runtimeOnly fg.deobf(localJars)
}

minecraft {
    mappings channel: project.mappings_channel, version: project.mappings_version
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // 生产版 mod（AE2/GTM）的 mixin refmap 需要在开发环境重映射
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods { GregNuovo { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            // 生产版 mod（AE2/GTM）的 mixin refmap 需要在开发环境重映射
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            jvmArgs '-Xmx2G'
            mods { GregNuovo { source sourceSets.main } }
        }
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand(
                'version': project.version,
                'mod_id': project.mod_id,
                'mod_name': project.mod_name,
                'mod_license': project.mod_license,
                'mod_authors': project.mod_authors,
                'mod_description': project.mod_description
        )
    }
}

jar {
    // LGPL-3.0：把许可证随产物一起分发
    from(rootProject.file('LICENSE')) {
        rename { "LICENSE-${project.mod_id}" }
        into 'META-INF'
    }
    manifest {
        attributes([
                'Specification-Title'   : project.mod_id,
                'Specification-Version' : '1',
                'Implementation-Title'  : project.mod_name,
                'Implementation-Version': project.version,
                'Implementation-Vendor' : project.mod_authors,
                // Forge 1.20.1 认这个清单属性来加载 Mixin 配置
                'MixinConfigs'          : 'gregnuovo.mixins.json'
        ] as LinkedHashMap)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = project.java_version as int
}
