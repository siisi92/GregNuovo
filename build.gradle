// GregNuovo —— AE2 与 GTM(1.20.1) 自动合成整合附属
plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.0.26)'
}

group = project.mod_group
version = project.mod_version
base { archivesName = project.mod_id }

java {
    withSourcesJar()
}

repositories {
    mavenCentral()
    flatDir { dirs project.libs_dir }
}

// 编译所需的依赖 jar（只用于编译/开发运行，不随仓库分发、不打包进产物）
def requiredLibs = [
        'gtceu-1.20.1-7.3.0.jar',
        'appliedenergistics2-forge-15.4.10.jar',
        'ldlib-forge-1.20.1-1.0.52.jar',
        'architectury-9.2.14-forge.jar',
        'configuration-forge-1.20.1-3.1.0.jar',
        'guideme-20.1.15.jar'
]
def missingLibs = requiredLibs.findAll { !file("${project.libs_dir}/${it}").exists() }
if (!missingLibs.isEmpty()) {
    def message = "缺少依赖 jar：${missingLibs.join(', ')}\n" +
            "请先运行 scripts/fetch-libs.ps1，或参考 libs/README.md 手动放入 ${project.libs_dir}/ 目录。"
    def tasks = gradle.startParameter.taskNames.join(' ')
    def needsLibs = tasks.isEmpty() || ['build', 'jar', 'run', 'compile', 'test'].any { tasks.contains(it) }
    if (needsLibs) {
        throw new GradleException(message)
    }
    logger.lifecycle("[GregNuovo] 提示：${message}")
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"

    // GTM 7.3.0（本体在目标整合包中，仅编译/开发期引用）
    compileOnly fg.deobf(files("${project.libs_dir}/gtceu-1.20.1-7.3.0.jar"))
    runtimeOnly fg.deobf(files("${project.libs_dir}/gtceu-1.20.1-7.3.0.jar"))

    // AE2 15.4.10
    compileOnly fg.deobf(files("${project.libs_dir}/appliedenergistics2-forge-15.4.10.jar"))
    runtimeOnly fg.deobf(files("${project.libs_dir}/appliedenergistics2-forge-15.4.10.jar"))

    // LDLib：GTM 7.3.0 的 UI/同步依赖（GTM 机器类层次引用 com.lowdragmc.*）
    compileOnly fg.deobf(files("${project.libs_dir}/ldlib-forge-1.20.1-1.0.52.jar"))
    runtimeOnly fg.deobf(files("${project.libs_dir}/ldlib-forge-1.20.1-1.0.52.jar"))

    // Architectury：LDLib 依赖
    compileOnly fg.deobf(files("${project.libs_dir}/architectury-9.2.14-forge.jar"))
    runtimeOnly fg.deobf(files("${project.libs_dir}/architectury-9.2.14-forge.jar"))

    // 仅开发环境运行期依赖（GTM / AE2 的必需前置）
    runtimeOnly fg.deobf(files("${project.libs_dir}/configuration-forge-1.20.1-3.1.0.jar"))
    runtimeOnly fg.deobf(files("${project.libs_dir}/guideme-20.1.15.jar"))
}

minecraft {
    mappings channel: project.mappings_channel, version: project.mappings_version
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // 生产版 mod（AE2/GTM）的 mixin refmap 需要在开发环境重映射
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods { GregNuovo { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            // 生产版 mod（AE2/GTM）的 mixin refmap 需要在开发环境重映射
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            jvmArgs '-Xmx2G'
            mods { GregNuovo { source sourceSets.main } }
        }
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand(
            'version': project.version,
            'mod_id': project.mod_id,
            'mod_name': project.mod_name,
            'mod_license': project.mod_license,
            'mod_authors': project.mod_authors,
            'mod_description': project.mod_description
        )
    }
}

jar {
    // LGPL-3.0：把许可证随产物一起分发
    from(rootProject.file('LICENSE')) {
        rename { "LICENSE-${project.mod_id}" }
        into 'META-INF'
    }
    manifest {
        attributes([
            'Specification-Title'    : project.mod_id,
            'Specification-Version'  : '1',
            'Implementation-Title'   : project.mod_name,
            'Implementation-Version' : project.version,
            'Implementation-Vendor'  : project.mod_authors,
            'MixinConfigs'           : 'gregnuovo.mixins.json'
        ] as LinkedHashMap)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = project.java_version as int
}
